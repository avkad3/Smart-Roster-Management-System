services:
  - type: web
    name: smart-roster-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_TOKEN
        value: change-me
      - key: PYTHON_VERSION
        value: "3.11.9"
    autoDeploy: true
